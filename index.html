<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pokemon Card</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="card">
    <img src="logo.png" alt="Logo" class="logo">
    <img src="image.png" alt="Menu" class="menu">
    
    
    <div class="text-content">
      <h4>POKEMON GEN I</h4>
      <h1>Pikachu</h1>
      <p>Pikachu is an Electric-type Pokémon introduced in Generation I. Pikachu are small, chubby, and incredibly cute mouse-like Pokémon. They are almost completely covered by yellow fur.</p>
      <span class="slide-number">— 01 / 08</span>
    </div>

    <img src="pika.png" alt="Pikachu" class="pikachu">
    
    <div class="pagination">
      <div class="dot active"></div>
      <div class="dot"></div>
      <div class="dot"></div>
      <div class="dot"></div>
      <div class="dot"></div>
    </div>
  </div>

</body>
</html>
